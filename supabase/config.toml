# Configuracao do Supabase CLI.
#
# project_id e apenas o nome do projeto LOCAL (nome do container do supabase
# start). O vinculo com um projeto remoto e feito por `supabase link
# --project-ref <ref>` e fica em supabase/.temp, que esta no .gitignore de
# proposito: esse diretorio aponta para um banco real e nunca deve ser
# versionado.
project_id = "rdc"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://127.0.0.1:3000/aceitar-convite", "http://localhost:3000/aceitar-convite"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "1m"

[auth.email.template.invite]
subject = "Voce foi convidado"

# ── Edge Functions ───────────────────────────────────────────────────────────
# verify_jwt = false apenas onde a funcao e chamada por terceiros e faz a
# propria autenticacao. As demais exigem um JWT valido.

[functions.asaas-webhook]
# Chamada pelo gateway de pagamento; valida ASAAS_WEBHOOK_TOKEN internamente.
verify_jwt = false

[functions.csp-report]
# Recebe relatorios de violacao de CSP do navegador, sem sessao.
verify_jwt = false

# Chat do Representante Digital Cognitivo. Autorizacao interna (JWT + papel + posse).
# [functions.cdr-chat] assume verify_jwt = true (padrao).
# [functions.cdr-extract] assume verify_jwt = true (padrao).
